# Orquestación del Sistema de Reserva de Entradas.
# Solo frontend y api-gateway publican puertos al host; el resto vive en backend-net (red interna).

name: sistema-reservas

services:
  # ======================= BASES DE DATOS =======================
  postgres:
    image: postgres:16-alpine
    container_name: reservas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      # Consumidas por el script de inicialización
      TX_DB: ${TX_DB}
      TX_USER: ${TX_USER}
      TX_PASSWORD: ${TX_PASSWORD}
      ANALYTICS_DB: ${ANALYTICS_DB}
      ANALYTICS_USER: ${ANALYTICS_USER}
      ANALYTICS_PASSWORD: ${ANALYTICS_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    expose:
      - "5432"
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: reservas-redis
    restart: unless-stopped
    # notify-keyspace-events Ex: emite eventos cuando expira una llave (liberación de asientos)
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --notify-keyspace-events Ex
      --appendonly no
    expose:
      - "6379"
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # ======================= MICROSERVICIOS =======================
  # Core transaccional: catálogo, usuarios, pagos y boletos. Solo accede a reservas_tx.
  service-java:
    build: ./service-java
    container_name: reservas-service-java
    restart: unless-stopped
    environment:
      SERVER_PORT: ${JAVA_PORT}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${TX_DB}
      SPRING_DATASOURCE_USERNAME: ${TX_USER}
      SPRING_DATASOURCE_PASSWORD: ${TX_PASSWORD}
    expose:
      - "${JAVA_PORT}"
    networks:
      - backend-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${JAVA_PORT}/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # Motor de concurrencia: bloqueos temporales de asientos y eventos Pub/Sub. Solo accede a Redis.
  service-go:
    build: ./service-go
    container_name: reservas-service-go
    restart: unless-stopped
    environment:
      PORT: ${GO_PORT}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: "0"
      LOCK_TTL_SECONDS: ${LOCK_TTL_SECONDS}
      GIN_MODE: release
    expose:
      - "${GO_PORT}"
    networks:
      - backend-net
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/server", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Motor de analíticas: registra compras confirmadas y expone estadísticas. Solo accede a reservas_analytics.
  service-python:
    build: ./service-python
    container_name: reservas-service-python
    restart: unless-stopped
    environment:
      PORT: ${PYTHON_PORT}
      DATABASE_URL: postgresql+asyncpg://${ANALYTICS_USER}:${ANALYTICS_PASSWORD}@postgres:5432/${ANALYTICS_DB}
      DB_POOL_SIZE: "5"
      LOG_LEVEL: INFO
    expose:
      - "${PYTHON_PORT}"
    networks:
      - backend-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen(f\"http://localhost:{os.environ['PORT']}/health\", timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ======================= API GATEWAY =======================
  # Único backend expuesto al host: HTTP (/api) + WebSockets. Puente entre frontend-net y backend-net.
  api-gateway:
    build: ./api-gateway
    container_name: reservas-api-gateway
    restart: unless-stopped
    environment:
      PORT: "4000"
      CORS_ORIGIN: ${CORS_ORIGIN}
      HTTP_TIMEOUT_MS: "5000"
      JAVA_SERVICE_URL: http://service-java:${JAVA_PORT}
      GO_SERVICE_URL: http://service-go:${GO_PORT}
      PYTHON_SERVICE_URL: http://service-python:${PYTHON_PORT}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    ports:
      - "${GATEWAY_PORT}:4000"
    networks:
      - frontend-net
      - backend-net
    depends_on:
      redis:
        condition: service_healthy
      service-java:
        condition: service_healthy
      service-go:
        condition: service_healthy
      service-python:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  # Red interna: sin salida a internet ni puertos publicables
  backend-net:
    driver: bridge
    internal: true
  # Red de borde: frontend <-> gateway, permite publicar puertos al host
  frontend-net:
    driver: bridge

volumes:
  postgres-data:
