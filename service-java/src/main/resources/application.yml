server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: service-java
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/reservas_tx}
    username: ${SPRING_DATASOURCE_USERNAME:tx_user}
    password: ${SPRING_DATASOURCE_PASSWORD:tx_secret}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # El esquema lo gestiona Flyway
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  # SMTP para el código de verificación. Gmail: usuario = la cuenta, contraseña = "contraseña de aplicación".
  # Con MAIL_USERNAME vacío no se envían correos y el código se escribe en el log.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

app:
  # Zona horaria de la cartelera: las horas de los horarios fijos son locales a esta zona
  timezone: ${APP_TIMEZONE:America/Caracas}
  schedule:
    days-ahead: ${APP_SCHEDULE_DAYS_AHEAD:7}
    cron: "0 5 0 * * *"   # todos los días a las 00:05
  # Administrador creado al iniciar (si no existe). Vacío = no se crea.
  admin:
    name: ${ADMIN_NAME:Administrador}
    username: ${ADMIN_USERNAME:admin}
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  mail:
    from: ${MAIL_FROM:}
  verification:
    ttl-minutes: 10
    max-attempts: 5
    resend-cooldown-seconds: 60

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  # Un fallo de Gmail no debe marcar el servicio como caído
  health:
    mail:
      enabled: false

logging:
  level:
    root: INFO
    com.reservas: DEBUG
