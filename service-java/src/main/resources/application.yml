server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: service-java
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/reservas_tx}
    username: ${SPRING_DATASOURCE_USERNAME:tx_user}
    password: ${SPRING_DATASOURCE_PASSWORD:tx_secret}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # El esquema lo gestiona Flyway
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  # Zona horaria de la cartelera: las horas de los horarios fijos son locales a esta zona
  timezone: ${APP_TIMEZONE:America/Caracas}
  schedule:
    days-ahead: ${APP_SCHEDULE_DAYS_AHEAD:7}
    cron: "0 5 0 * * *"   # todos los días a las 00:05
  # Administrador creado al iniciar (si no existe). Vacío = no se crea.
  admin:
    name: ${ADMIN_NAME:Administrador}
    username: ${ADMIN_USERNAME:admin}
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.reservas: DEBUG
