server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: service-java
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/reservas_tx}
    username: ${SPRING_DATASOURCE_USERNAME:tx_user}
    password: ${SPRING_DATASOURCE_PASSWORD:tx_secret}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # El esquema lo gestiona Flyway
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.reservas: DEBUG
